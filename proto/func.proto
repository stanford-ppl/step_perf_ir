syntax = "proto3";

package step_perf_ir;

message ElemtoElemFunc {
  oneof elem_elem_fn {
    Matmul matmul = 1;
    Mul mul = 2;
    Silu silu = 3;
    Add add = 4;
    Div div = 5;
    DynMatmul dyn_matmul = 6;
    CacheWriteAddrGen cache_write_addr_gen = 7;
    RowWiseAppend row_wise_append = 8;
    SetOffset set_offset = 9;
    Exp exp = 10;
    RowWiseSum row_wise_sum = 11;
    MaskRow mask_row = 12;
    IsEqual is_equal = 13;
    MulConstant mul_constant = 14;
    AddConstant add_constant = 15;
    SubConstant sub_constant = 16;
    SelectToScalar select_to_scalar = 17;
    ToConstInt to_const_int = 18;
    Pow2 pow2 = 19;
    Rsqrt rsqrt = 20;
    MultihotToU64 multihot_to_u64 = 21;
    U64ToMultihot u64_to_multihot = 22;
    BroadcastRows broadcast_rows = 23;
    Pow pow = 24;
    Tanh tanh = 25;
    Sigmoid sigmoid = 26;
    Clamp clamp = 27;
    GeScalar ge_scalar = 28;
    BitwiseNot bitwise_not = 29;
    FloorDivideConstant floor_divide_constant = 30;
    EmptyLike empty_like = 31;
    ZerosLike zeros_like = 32;
    F32ToBf16 f32_to_bf16 = 33;
    Bf16ToF32 bf16_to_f32 = 34;
    F32ToBool f32_to_bool = 35;
    I64ToF32 i64_to_f32 = 36;
    IndexToMultihot index_to_multihot = 37;
    Transpose transpose = 38;
    RowWiseMax row_wise_max = 39;
    Sub sub = 40;
    RemainderConstant remainder_constant = 41;
    I64ToU64 i64_to_u64 = 42;
    Gather gather = 43;
    Mask mask = 44;
  }
}

message IsEqual {}

message MaskRow {
  uint32 row = 1;
  uint32 col = 2;
}

message MapAccumFunc {
  oneof map_accum_fn {
    Matmul matmul = 1;
    DynMatmul dyn_matmul = 2;
  }
}

message InitFunc {
  oneof init_fn {
    Zero zero = 1;
    Empty empty = 2;
    DynEmpty dyn_empty = 3;
    NegInf neg_inf = 4;
  }
}

message AccumFunc {
  oneof accum_fn {
    Matmul matmul = 1;
    Mul mul = 2;
    Add add = 3;
    RetileCol retile_col = 4;
    RetileRow retile_row = 5;
    SignalReqAllRead signal_req_all_read = 6;
    MeanStatic mean_static = 7;
    VarStatic var_static = 8;
    MeanDyn mean_dyn = 9;
    VarDyn var_dyn = 10;
    Max max = 11;
    Last last = 12;
  }
}

message Matmul { bool weight_transposed = 1; }

message DynMatmul { bool weight_transposed = 1; }

message Zero {}

message Empty {}
message DynEmpty {}
// Seeds an accumulator with negative infinity: the identity for a `Max` fold,
// so an all-negative reduction group still produces the right maximum.
message NegInf {}

message Mul {}

message MulConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message Add {}

message Max {}

// Keeps only the last element of each reduction group: a stream
// `[1, 2 s1, 3, 4 s2]` reduces to `[2, 4 s1]`.
message Last {}

message AddConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message SubConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message Sub {}

message Div {}

message Silu {}

message RetileCol {}

message RetileRow {}

message CacheWriteAddrGen { uint64 offset_per_idx = 1; }

message RowWiseAppend {}

message SetOffset {}

message Exp {}

message Pow2 {}

message Rsqrt {}

message RowWiseSum {}

message RowWiseMax {}

message SignalReqAllRead {}

message SelectToScalar {}

message ToConstInt { int32 constant = 1; }

message MultihotToU64 {}

message U64ToMultihot { uint32 width = 1; }

message BroadcastRows { uint32 row_size = 1; }

message Pow { float exponent = 1;}

message Tanh {}

// sigmoid(x) = 1 / (1 + e^-x)
message Sigmoid {}

// clamp(x, min, max). Either bound may be omitted (aten.clamp allows None).
// Integer bounds use `min`/`max`; floating-point bounds use `min_float`/`max_float`.
message Clamp {
  optional int32 min = 1;
  optional float min_float = 2;
  optional int32 max = 3;
  optional float max_float = 4;
}

// ge_scalar(x, s) = (x >= s) -> bool
message GeScalar {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

// bitwise_not(x) = !x (logical NOT on bool tiles)
message BitwiseNot {}

// floor_divide(x, d) = floor(x / d) with a scalar divisor
message FloorDivideConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

// remainder(x, d) with PyTorch's signed remainder semantics.
message RemainderConstant { int64 constant = 1; }

// Checked address conversion. Negative inputs are invalid.
message I64ToU64 {}

// Tile-local last-dimension gather: source [R,C], index [1,R] -> [1,R].
message Gather {}

// Keep the first in2[0,0] rows or columns of in1; fill the rest with val.
// in2 is an i64/u64 scalar in [0, axis extent]. Shape and dtype are preserved.
message Mask {
  bool row = 1;
  float val = 2;
}

// empty_like(x): uninitialized tensor with the same shape/dtype as x
message EmptyLike {}

// zeros_like(x): zero-filled tensor with the same shape/dtype as x
message ZerosLike {}

// _to_copy cast: f32 -> bf16 (simulated as Tile<f32>, bytes_per_elem = 2)
message F32ToBf16 {}

// _to_copy cast: bf16 -> f32 (simulated as Tile<f32>, bytes_per_elem = 4)
message Bf16ToF32 {}

// _to_copy cast: f32 -> bool (nonzero elements become true)
message F32ToBool {}

// _to_copy cast: i64 -> f32 (value-preserving numeric cast)
message I64ToF32 {}

// index_to_multihot(x): encode the index values in a single-row tile into a
// multihot vector of `num_classes` booleans (position i set iff i appears in x).
message IndexToMultihot { uint32 num_classes = 1; }

// transpose(x): tile-wise 2D transpose ([m, n] -> [n, m]). Dtype-preserving.
message Transpose {}

// Row-wise mean over the reduced ranks. Unlike the other accumulation
// functions, each tile's columns collapse too: a stream of [R, C] tiles reduces
// to one [R, 1] tile per reduction group.
//
// `count` is the number of *elements* reduced per row -- C summed over every
// tile in the reduced ranks (`n_embd` for layer norm) -- not the tile count.
// It is known at compile time; use `MeanDyn` when it is not.
message MeanStatic { uint64 count = 1; }

// Row-wise population variance (divides by `count`, not `count - 1`), matching
// native_layer_norm. Same [R, C] -> [R, 1] collapse and same `count` meaning as
// `MeanStatic`.
message VarStatic { uint64 count = 1; }

// `MeanStatic` with an element count only known at run time (dynamic reduced
// dims), so the simulator counts as it goes.
message MeanDyn {}

// `VarStatic` with an element count only known at run time.
message VarDyn {}
