syntax = "proto3";

package step_perf_ir;

message ElemtoElemFunc {
  oneof elem_elem_fn {
    Matmul matmul = 1;
    Mul mul = 2;
    Silu silu = 3;
    Add add = 4;
    Div div = 5;
    DynMatmul dyn_matmul = 6;
    CacheWriteAddrGen cache_write_addr_gen = 7;
    RowWiseAppend row_wise_append = 8;
    SetOffset set_offset = 9;
    Exp exp = 10;
    RowWiseSum row_wise_sum = 11;
    MaskRow mask_row = 12;
    IsEqual is_equal = 13;
    MulConstant mul_constant = 14;
    AddConstant add_constant = 15;
    SubConstant sub_constant = 16;
    SelectToScalar select_to_scalar = 17;
    ToConstInt to_const_int = 18;
    Pow2 pow2 = 19;
    Rsqrt rsqrt = 20;
    Square square = 21;
    Sub sub = 22;
    Sqrt sqrt = 23;
    MaxConstant max_constant = 24;
    Tanh tanh = 25;
    PowImmediate pow_imm = 26;
  }
}

message IsEqual {}

message MaskRow {
  uint32 row = 1;
  uint32 col = 2;
}

message MapAccumFunc {
  oneof map_accum_fn {
    Matmul matmul = 1;
    DynMatmul dyn_matmul = 2;
  }
}

message InitFunc {
  oneof init_fn {
    Zero zero = 1;
    Empty empty = 2;
    DynEmpty dyn_empty = 3;
  }
}

message AccumFunc {
  oneof accum_fn {
    Matmul matmul = 1;
    Mul mul = 2;
    Add add = 3;
    RetileCol retile_col = 4;
    RetileRow retile_row = 5;
    SignalReqAllRead signal_req_all_read = 6;
    Max max = 7;
  }
}

message Matmul { bool weight_transposed = 1; }

message DynMatmul { bool weight_transposed = 1; }

message Zero {}

message Empty {}
message DynEmpty {}

message Mul {}

message Max {}

message MulConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message Add {}

message Sub {}

message Sqrt {}

message AddConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message SubConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message MaxConstant {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message PowImmediate {
  optional int32 constant = 1;
  optional float constant_float = 2;
}

message Div {}

message Silu {}

message Tanh {}

message RetileCol {}

message RetileRow {}

message CacheWriteAddrGen { uint64 offset_per_idx = 1; }

message RowWiseAppend {}

message SetOffset {}

message Exp {}

message Pow2 {}

message Rsqrt {}

message Square {}

message RowWiseSum {}

message SignalReqAllRead {}

message SelectToScalar {}

message ToConstInt { int32 constant = 1; }