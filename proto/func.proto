syntax = "proto3";

package step_perf_ir;

message ElemtoElemFunc {
  oneof elem_elem_fn {
    Matmul matmul = 1;
    Mul mul = 2;
    Silu silu = 3;
    Add add = 4;
    DynMatmul dyn_matmul = 5;
  }
}

message MapAccumFunc {
  oneof map_accum_fn {
    Matmul matmul = 1;
    DynMatmul dyn_matmul = 2;
  }
}

message InitFunc {
  oneof init_fn {
    Zero zero = 1;
    Empty empty = 2;
  }
}

message AccumFunc {
  oneof accum_fn {
    Matmul matmul = 1;
    Mul mul = 2;
    Add add = 3;
    RetileCol retile_col = 4;
    RetileRow retile_row = 5;
  }
}

message Matmul { bool weight_transposed = 1; }

message DynMatmul { bool weight_transposed = 1; }

message Zero {}

message Empty {}

message Mul {}

message Add {}

message Silu {}

message RetileCol {}

message RetileRow {}